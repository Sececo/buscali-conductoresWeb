[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # En Netlify las peticiones van a /api/v1 del mismo dominio (redirect abajo → Render)
  VITE_USE_PROXY = "true"

# Proxy en el servidor de Netlify: evita CORS (misma origen para el navegador)
[[redirects]]
  from = "/api/*"
  to = "https://buscali-backend.onrender.com/api/:splat"
  status = 200
  force = true

# SPA React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
